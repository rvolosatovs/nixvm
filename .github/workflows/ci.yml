name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --no-build
      - name: libkrun flake input matches the submodule
        run: |
          submodule=$(git ls-tree HEAD vendor/libkrun | awk '{print $3}')
          input=$(jq -r .nodes.libkrun.locked.rev flake.lock)
          test "$submodule" = "$input" || {
            echo "vendor/libkrun is at $submodule but flake.lock pins libkrun at $input; run \`nix flake update libkrun\`" >&2
            exit 1
          }

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make

  nix-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build -L
